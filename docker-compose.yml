version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # ⚙️ API & WS trỏ về backend container (không dùng localhost trong Compose)
      - VITE_API_URL=http://backend:8080
      - VITE_WS_URL=ws://backend:8080/ws/chat
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - chatbot
    environment:
      - NODE_ENV=production
      # 🧠 URL nội bộ gọi sang chatbot container
      - CHATBOT_URL=http://chatbot:8003
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: ./chatbot-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
